# Industrial DMZ reverse proxy: publishes the operator interface to the
# Enterprise network without exposing the Supervisory zone directly.
# Host :8080 -> proxy :80 -> HMI (172.22.0.10:8080) via the zone gateway.
#
# Structured access log (with the redirect target) is written to a shared volume
# so the login-monitor can detect failed authentications (HMI-3.3).
log_format ot_json escape=json
    '{"time":"$time_local","remote_addr":"$remote_addr","request":"$request","status":$status,"location":"$sent_http_location"}';
access_log /var/log/otproxy/access.log ot_json;

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://172.22.0.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
