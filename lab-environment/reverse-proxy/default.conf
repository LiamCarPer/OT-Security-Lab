# Industrial DMZ reverse proxy: publishes the operator interface to the
# Enterprise network without exposing the Supervisory zone directly.
# Host :8080 -> proxy :80 -> HMI (172.22.0.10:8080) via the zone gateway.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://172.22.0.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
