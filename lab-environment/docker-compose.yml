
services:
  # 1. The "Firewall" / Router / Gateway
  gateway:
    build: ./gateway
    container_name: ot_gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - DAC_OVERRIDE
    sysctls:
      - net.ipv4.ip_forward=1
    mem_limit: 1g
    command: /bin/sh -c "sh /network-config/firewall-rules.sh && sh /scripts/start_ids.sh && tail -f /dev/null"
    volumes:
      - ../detection/rules:/detection/rules
      - ../detection/logs:/detection/logs
      - ./network-config:/network-config
      - ./scripts:/scripts
    networks:
      it_network:
        ipv4_address: 172.24.0.2
      ops_network:
        ipv4_address: 172.23.0.2
      supervisory_network:
        ipv4_address: 172.22.0.2
      control_network:
        ipv4_address: 172.21.0.2
      dmz_network:
        ipv4_address: 172.25.0.2

  # 2. Intake Process PLC (Level 1 - Control)
  plc_intake:
    # Pinned by digest: the runtime version must match the editor/STruC++
    # version that produced the committed program bundles (plc/programs/).
    image: ghcr.io/autonomy-logic/openplc-runtime@sha256:83fd5099cf2d100faf9a23ab3131f7200f3fdd0a007c07a870563af3705fc15f
    container_name: plc_intake
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8443:8443"
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    networks:
      control_network:
        ipv4_address: 172.21.0.10

  # 3. Treatment Process PLC (Level 1 - Control)
  plc_treatment:
    image: ghcr.io/autonomy-logic/openplc-runtime@sha256:83fd5099cf2d100faf9a23ab3131f7200f3fdd0a007c07a870563af3705fc15f
    container_name: plc_treatment
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8444:8443"
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    networks:
      control_network:
        ipv4_address: 172.21.0.11

  # 4. Distribution Process PLC (Level 1 - Control)
  plc_distribution:
    image: ghcr.io/autonomy-logic/openplc-runtime@sha256:83fd5099cf2d100faf9a23ab3131f7200f3fdd0a007c07a870563af3705fc15f
    container_name: plc_distribution
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8445:8443"
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    networks:
      control_network:
        ipv4_address: 172.21.0.12

  # 4a. Controller route sidecars - share each PLC's netns and route replies to
  # the Supervisory/Operations zones through the gateway, so the HMI/collector/
  # EWS reach the real controllers and the traffic stays observable (symmetric
  # routing through the chokepoint; see LESSONS_LEARNED.md).
  plc-intake-route:
    build: ./route-sidecar
    container_name: ot_plc_intake_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:plc_intake"
    command: >
      /bin/sh -c "for net in 172.22.0.0/24 172.23.0.0/24; do
      until ip route replace $$net via 172.21.0.2 2>/dev/null; do sleep 2; done; done;
      exec tail -f /dev/null"
    depends_on:
      - plc_intake

  plc-treatment-route:
    build: ./route-sidecar
    container_name: ot_plc_treatment_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:plc_treatment"
    command: >
      /bin/sh -c "for net in 172.22.0.0/24 172.23.0.0/24; do
      until ip route replace $$net via 172.21.0.2 2>/dev/null; do sleep 2; done; done;
      exec tail -f /dev/null"
    depends_on:
      - plc_treatment

  plc-distribution-route:
    build: ./route-sidecar
    container_name: ot_plc_distribution_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:plc_distribution"
    command: >
      /bin/sh -c "for net in 172.22.0.0/24 172.23.0.0/24; do
      until ip route replace $$net via 172.21.0.2 2>/dev/null; do sleep 2; done; done;
      exec tail -f /dev/null"
    depends_on:
      - plc_distribution

  # 5. Human Machine Interface (Level 2 - Supervisory)
  # Real Scada-LTS: polls the PLCs over Modbus/TCP and writes commands. Its
  # configuration lives in MySQL and is created by the scada-provisioner.
  # Supervisory-only: Control-zone traffic is routed through the gateway so the
  # zone firewall (C1) applies and the IDS observes the real Modbus traffic.
  hmi:
    build: ./hmi
    container_name: ot_hmi
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    environment:
      - CATALINA_OPTS=-Xmx768M -Xms256M
    depends_on:
      database:
        condition: service_healthy
    networks:
      supervisory_network:
        ipv4_address: 172.22.0.10

  # 5a. Scada-LTS configuration store (Level 2 - Supervisory)
  # The Scada-LTS image connects to a host named "database" on 3306 with
  # root/root (baked into its context.xml); the name must resolve on a shared
  # network, so it lives on the supervisory network alongside the HMI.
  database:
    image: mysql/mysql-server:8.0.32
    container_name: ot_scada_db
    restart: unless-stopped
    mem_limit: 512m
    command: --log_bin_trust_function_creators=1 --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=scadalts
    volumes:
      - scada_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      supervisory_network:
        ipv4_address: 172.22.0.11

  # 5b. Scada-LTS provisioner (Level 2) - one-shot REST bootstrap
  # Creates Modbus/TCP datasources + datapoints for all three PLCs. Idempotent
  # (existing XIDs are skipped). Kept resident so its healthcheck is meaningful.
  scada-provisioner:
    build: ./scada
    container_name: ot_scada_provisioner
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OT_SCADA_URL=http://hmi:8080/Scada-LTS
    depends_on:
      - hmi
    command: >
      /bin/sh -c "sh /usr/local/bin/provision.sh && touch /tmp/scada-provisioned && tail -f /dev/null"
    networks:
      supervisory_network:
        ipv4_address: 172.22.0.12

  # 5c. Historian collector (Level 2 - Supervisory)
  # Reads controllers over C1 (Supervisory -> Control 502) and writes the L3
  # InfluxDB northbound over C3 (Supervisory -> Ops 8086). Prefers the OpenPLC
  # controllers and falls back to the process stand-in when they are unprogrammed.
  historian-poller:
    build: ./historian-poller
    container_name: ot_historian_poller
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    environment:
      - OT_INFLUX_URL=http://172.23.0.10:8086
      - OT_POLL_INTERVAL=5
    command: >
      /bin/sh -c "for net in 172.21.0.0/24 172.23.0.0/24; do
      until ip route replace $$net via 172.22.0.2 2>/dev/null; do sleep 2; done; done;
      exec python3 -u /app/poller.py"
    networks:
      supervisory_network:
        ipv4_address: 172.22.0.20

  # 6. Process Historian (Level 3 - Operations)
  historian:
    image: influxdb:1.8.10
    container_name: ot_historian
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - INFLUXDB_DB=ot_data
    networks:
      ops_network:
        ipv4_address: 172.23.0.10

  # 6.1 Historian route sidecar - shares the historian's netns so its replies to
  # the L2 collector (C3) and L4 Grafana (C4) return through the gateway.
  historian-route:
    build: ./route-sidecar
    container_name: ot_historian_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:historian"
    command: >
      /bin/sh -c "until ip route replace default via 172.23.0.2 2>/dev/null; do sleep 2; done;
      exec tail -f /dev/null"
    depends_on:
      - historian

  # 6a. Engineering workstation / PLC provisioning host (Level 3 - Operations)
  # The EWS documented in asset-inventory/assets.csv now actually exists: it
  # deploys the committed OpenPLC program bundles over the runtime REST API
  # (TCP 8443) via a dedicated OPS->CONTROL conduit in the zone firewall.
  plc-bootstrap:
    build: ./plc-bootstrap
    container_name: ot_plc_bootstrap
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    depends_on:
      plc_intake:
        condition: service_healthy
      plc_treatment:
        condition: service_healthy
      plc_distribution:
        condition: service_healthy
    command: >
      /bin/sh -c "until ip route replace 172.21.0.0/24 via 172.23.0.2 2>/dev/null; do sleep 2; done;
      python3 -u /app/deploy.py && exec tail -f /dev/null"
    volumes:
      - ../plc/programs:/programs:ro
    networks:
      ops_network:
        ipv4_address: 172.23.0.4

  # --- Multi-protocol endpoints (Level 1 - Control) ---

  # 6b. DNP3 outstation (real opendnp3 via dnp3-python)
  dnp3-outstation:
    build: ./dnp3-outstation
    container_name: ot_dnp3_outstation
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    # Default route via the gateway keeps the return path symmetric through the
    # chokepoint (otherwise replies bypass it via the host and sessions stall).
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/outstation.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.50

  # 6c. OPC UA server (real asyncua server, plaintext None policy)
  opcua-server:
    build: ./opcua-server
    container_name: ot_opcua_server
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/server.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.51

  # 6d. S7comm server (pure-Python S7 server on privileged port 102)
  s7-plc:
    build: ./s7-plc
    container_name: ot_s7_plc
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/server.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.52

  # --- Process stand-in (Level 1 - Control) ---
  # Serves the canonical register map on 502 with the ST-level controller logic,
  # so the historian path has a real Modbus source until the OpenPLC program
  # bundles are committed. Each one routes replies back through the gateway.

  modbus-sim-intake:
    build: ./modbus-sim
    container_name: ot_modbus_sim_intake
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    environment:
      - OT_SIM_ASSET=intake
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/server.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.60

  modbus-sim-treatment:
    build: ./modbus-sim
    container_name: ot_modbus_sim_treatment
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    environment:
      - OT_SIM_ASSET=treatment
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/server.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.61

  modbus-sim-distribution:
    build: ./modbus-sim
    container_name: ot_modbus_sim_distribution
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    environment:
      - OT_SIM_ASSET=distribution
    command: >
      /bin/sh -c "until ip route replace default via 172.21.0.2 2>/dev/null; do sleep 2; done;
      exec python3 -u /app/server.py"
    networks:
      control_network:
        ipv4_address: 172.21.0.62

  # 7. Attacker (Level 4/5 - Enterprise/Internet)
  attacker:
    build: ./attacker
    container_name: ot_attacker
    restart: unless-stopped
    mem_limit: 512m
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
    # Add the pivot routes to reach the OT zones via the gateway. Routes are
    # retried until the gateway is reachable (it is created in parallel).
    command: >
      /bin/sh -c "for net in 172.21.0.0/24 172.22.0.0/24 172.23.0.0/24; do
      until ip route add $$net via 172.24.0.2 2>/dev/null; do sleep 2; done; done;
      tail -f /dev/null"
    volumes:
      - ./attacker:/attacker
    networks:
      it_network:
        ipv4_address: 172.24.0.10

  # 7a. Compromised engineering workstation (Level 3 - Operations)
  # The adversary pivot: uses the EWS's legitimate conduits to drive the real
  # protocol clients (DNP3 / OPC UA / S7comm) against the control-zone endpoints.
  insider:
    build: ./insider
    container_name: ot_insider
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    depends_on:
      - dnp3-outstation
      - opcua-server
      - s7-plc
    volumes:
      - ./attacker:/attacker:ro
    networks:
      ops_network:
        ipv4_address: 172.23.0.20

  # --- Industrial DMZ (Level 3.5) ---
  # The boundary zone: corporate access terminates here and is proxied to the
  # Supervisory HMI. It is the only non-internal network aside from the
  # Enterprise zone, so the published proxy is reachable from the host.

  # Reverse proxy: publishes the operator interface (host 8080 -> HMI via C10).
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: ot_reverse_proxy
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy_logs:/var/log/otproxy
    ports:
      - "8080:80"
    networks:
      dmz_network:
        ipv4_address: 172.25.0.10

  # Route sidecar: DMZ -> Supervisory via the gateway (conduit C10).
  proxy-route:
    build: ./route-sidecar
    container_name: ot_proxy_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:reverse-proxy"
    command: >
      /bin/sh -c "for net in 172.22.0.0/24 172.24.0.0/24; do
      until ip route replace $$net via 172.25.0.2 2>/dev/null; do sleep 2; done; done;
      exec tail -f /dev/null"
    depends_on:
      - reverse-proxy

  # Jump host / bastion: the mandatory entry point for remote maintenance.
  bastion:
    build: ./bastion
    container_name: ot_bastion
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    ports:
      - "2222:22"
    networks:
      dmz_network:
        ipv4_address: 172.25.0.11

  # Corporate workstation (Enterprise zone) exercising the DMZ access path.
  corporate-workstation:
    build: ./corporate-workstation
    container_name: ot_corp_ws
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    networks:
      it_network:
        ipv4_address: 172.24.0.30

  # DMZ login monitor: detects failed Scada-LTS logins in the proxy access log
  # (HMI-3.3) and raises HMI_LOGIN_FAILURE alerts.
  hmi-login-monitor:
    build: ./hmi-login-monitor
    container_name: ot_hmi_login_monitor
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - proxy_logs:/var/log/otproxy:ro
      - ../detection/logs:/logs
    networks:
      dmz_network:
        ipv4_address: 172.25.0.12

  # --- SIEM STACK (Level 3 & Level 4 Integration) ---

  # 8. Log Storage (Loki) - Level 4 Enterprise
  loki:
    image: grafana/loki:3.0.0
    container_name: ot_loki
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../siem/configs/loki-config.yaml:/etc/loki/local-config.yaml
      - ../siem/rules:/etc/loki/rules/fake:ro
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      it_network:
        ipv4_address: 172.24.0.20

  # 9. Log Collector (Promtail) - Level 4 Enterprise
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ot_promtail
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../siem/configs/promtail-config.yaml:/etc/promtail/config.yml
      - ../detection/logs:/logs
    networks:
      it_network:
        ipv4_address: 172.24.0.21

  # 10. Visualization (Grafana) - Level 4 Enterprise
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ot_grafana
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ../siem/configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../siem/configs/grafana-dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ../siem/dashboards:/var/lib/grafana/dashboards
    networks:
      it_network:
        ipv4_address: 172.24.0.22

  # 10a. Grafana route sidecar - shares Grafana's netns and installs the L3
  # route so the historian datasource traverses conduit C4 (IT -> Ops 8086).
  grafana-route:
    build: ./route-sidecar
    container_name: ot_grafana_route
    restart: unless-stopped
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    network_mode: "service:grafana"
    command: >
      /bin/sh -c "until ip route replace 172.23.0.0/24 via 172.24.0.2 2>/dev/null; do sleep 2; done;
      exec tail -f /dev/null"
    depends_on:
      - grafana

  # 11. Alert Manager - Level 4 Enterprise
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ot_alertmanager
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../siem/configs/alertmanager-config.yaml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      it_network:
        ipv4_address: 172.24.0.23

  # 12. Alert Webhook Receiver (SOAR-lite) - Level 4 Enterprise
  webhook:
    build: ../automation/playbooks
    container_name: ot_webhook
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    environment:
      - OT_WEBHOOK_LOG=/logs/siem_alerts.json
    volumes:
      - ../detection/logs:/logs
    networks:
      it_network:
        ipv4_address: 172.24.0.24

networks:
  it_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
  ops_network:
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
  supervisory_network:
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24
  control_network:
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  # Industrial DMZ boundary zone: not internal, so the reverse proxy is
  # reachable from the host; the gateway still enforces DMZ <-> OT conduits.
  dmz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  # Scada-LTS configuration (datasources/datapoints) persists across restarts;
  # `docker compose down -v` resets it and the provisioner re-seeds on next boot.
  scada_db_data:
