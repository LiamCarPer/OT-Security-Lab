# Pre-commit hooks for the OT Security Lab
# Install: pip install pre-commit && pre-commit install
# Run all hooks: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: detection/logs/  # NDJSON evidence, not JSON documents
      - id: check-added-large-files
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff  # entry is already 'ruff check --force-exclude'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [lab-environment/network-config/firewall-rules.sh, lab-environment/scripts/start_ids.sh]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
