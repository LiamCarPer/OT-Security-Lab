name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check detection automation governance tests
      - name: Bandit SAST
        run: bandit -q -r detection automation governance -x governance/testing

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest tests -q

  shell:
    name: Shell Script Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          path: lab-environment

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt

  iac:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: lab-environment
          framework: all

  container:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

  policy:
    name: Policy-as-Code (OPA/conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -sSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Enforce compose hardening policy
        run: conftest test -p tests/policy lab-environment/docker-compose.yml

  precommit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run all hooks
        run: pre-commit run --all-files

  sbom:
    name: SBOM & Attestation (Sigstore)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: ot-security-lab-sbom
          upload-artifact: true
      - name: Generate gateway base image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: alpine:3.19
          format: spdx-json
          artifact-name: gateway-base-sbom
          upload-artifact: true
      - name: Install cosign
        run: |
          curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          cosign version
      - name: Keyless sign SBOM via Sigstore
        run: |
          SBOM=$(find . -name "*.spdx.json" | head -1)
          echo "Signing: $SBOM"
          cosign sign-blob --yes "$SBOM" \
            --output-signature sbom.sig \
            --output-certificate sbom.pem
      - name: Verify signature (identity pinned)
        run: |
          SBOM=$(find . -name "*.spdx.json" | head -1)
          cosign verify-blob \
            --certificate sbom.pem \
            --signature sbom.sig \
            --certificate-identity "https://github.com/LiamCarPer/OT-Security-Lab/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$SBOM"
      - name: Upload signature artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signature
          path: |
            sbom.sig
            sbom.pem
