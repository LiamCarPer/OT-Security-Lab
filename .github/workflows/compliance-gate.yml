name: Compliance Gate (Live Lab Validation)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  lab-validation:
    name: Boot Lab, Simulate Attacks, Assert Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot the OT lab
        working-directory: lab-environment
        run: |
          set +e
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee /tmp/boot.log
          code=${PIPESTATUS[0]}
          echo "BOOT_EXIT=$code" | tee -a /tmp/boot.log
          exit $code

      - name: Show firewall policy applied on gateway
        run: docker exec ot_gateway iptables -L -n | head -40

      - name: Run attack simulations and assert detection
        run: python3 governance/testing/run_security_tests.py --reset

      - name: Diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "## Compliance Gate Diagnostics - ${{ github.sha }}"
            echo ""
            echo "### Boot log (compose output)"
            cat /tmp/boot.log 2>/dev/null || echo "(boot log not available)"
            echo ""
            echo "### Container states"
            docker ps -a
            echo ""
            echo "### Gateway logs dir listing"
            docker exec ot_gateway sh -c "ls -la /detection/logs" || true
            echo ""
            echo "### Gateway process table"
            docker exec ot_gateway sh -c "ps aux" || true
            echo ""
            echo "### Gateway IDS rule outputs"
            docker exec ot_gateway sh -c "for f in /detection/logs/*.out; do echo --- \$f; tail -25 \"\$f\"; done" || true
            echo ""
            echo "### alerts.json tail"
            tail -25 detection/logs/alerts.json 2>/dev/null || echo "alerts.json missing or empty"
            echo ""
            echo "### Attacker routes and tools"
            docker exec ot_attacker sh -c "ip route; echo; which pgrep || echo NO_PGREP" || true
            echo ""
            echo "### Gateway firewall"
            docker exec ot_gateway iptables -L -n || true
            echo ""
            echo "### Gateway container log"
            docker logs ot_gateway --tail 40 || true
            echo ""
            echo "### Attacker container log"
            docker logs ot_attacker --tail 40 || true
            echo ""
            echo "### Webhook state and log"
            docker inspect ot_webhook --format "status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} cmd={{.Config.Cmd}}" || true
            docker logs ot_webhook --tail 40 || true
            echo ""
            echo "### Webhook process table"
            docker top ot_webhook || true
          } | tee /tmp/cg-diag.txt
          echo ""
          echo "Posting diagnostics to issue..."
          python3 - "${{ github.sha }}" <<'PYEOF' > /tmp/body.json
          import json, sys
          payload = {
              "title": f"Compliance Gate diagnostics {sys.argv[1]}",
              "body": open("/tmp/cg-diag.txt").read(),
          }
          print(json.dumps(payload))
          PYEOF
          RESP=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            --data @/tmp/body.json 2>&1)
          echo "$RESP" | tail -6

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          cp -r detection/logs evidence/ci/
          docker exec ot_gateway sh -c "ls -la /detection/logs" > evidence/ci/gateway_ids.txt || true
          docker exec ot_gateway iptables -L -n > evidence/ci/firewall_rules.txt || true
          docker exec ot_gateway iptables -L -n -t nat > evidence/ci/firewall_nat.txt || true

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: evidence/ci/
