name: Compliance Gate (Live Lab Validation)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  lab-validation:
    name: Boot Lab, Simulate Attacks, Assert Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot the OT lab
        working-directory: lab-environment
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show firewall policy applied on gateway
        run: docker exec ot_gateway iptables -L -n | head -40

      - name: Run attack simulations and assert detection
        run: python3 governance/testing/run_security_tests.py --reset

      - name: Diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "## Compliance Gate Diagnostics - ${{ github.sha }}"
            echo ""
            echo "### Container states"
            docker ps -a
            echo ""
            echo "### Gateway IDS processes"
            docker exec ot_gateway sh -c "pgrep -af python3 || echo NO_IDS_RUNNING" || true
            echo ""
            echo "### Gateway IDS rule outputs"
            docker exec ot_gateway sh -c "for f in /detection/logs/*.out; do echo --- \$f; tail -15 \"\$f\"; done" || true
            echo ""
            echo "### alerts.json tail"
            tail -25 detection/logs/alerts.json 2>/dev/null || echo "alerts.json missing or empty"
            echo ""
            echo "### Attacker routes"
            docker exec ot_attacker sh -c "ip route" || true
            echo ""
            echo "### Gateway firewall"
            docker exec ot_gateway iptables -L -n || true
            echo ""
            echo "### Gateway container log"
            docker logs ot_gateway --tail 40 || true
            echo ""
            echo "### Attacker container log"
            docker logs ot_attacker --tail 40 || true
          } | tee /tmp/cg-diag.txt
          echo ""
          echo "Posting diagnostics to issue..."
          BODY=$(python3 -c "import json; print(json.dumps(open('/tmp/cg-diag.txt').read()))")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Compliance Gate diagnostics ${{ github.sha }}\",\"body\":$BODY}" || true

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          cp -r detection/logs evidence/ci/
          docker exec ot_gateway sh -c "ls -la /detection/logs" > evidence/ci/gateway_ids.txt || true
          docker exec ot_gateway iptables -L -n > evidence/ci/firewall_rules.txt || true
          docker exec ot_gateway iptables -L -n -t nat > evidence/ci/firewall_nat.txt || true

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: evidence/ci/
