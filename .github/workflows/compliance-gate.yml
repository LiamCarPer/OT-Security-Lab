name: Compliance Gate (Live Lab Validation)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lab-validation:
    name: Boot Lab, Simulate Attacks, Assert Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot the OT lab
        working-directory: lab-environment
        run: |
          set +e
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee /tmp/boot.log
          code=${PIPESTATUS[0]}
          echo "BOOT_EXIT=$code" | tee -a /tmp/boot.log
          exit $code

      - name: Show firewall policy applied on gateway
        run: docker exec ot_gateway iptables -L -n | head -40

      - name: Run attack simulations and assert detection
        run: python3 governance/testing/run_security_tests.py --reset

      # Keep the committed evidence machine-fresh: after a green run the
      # alerts generated by this run replace the tracked alerts.json.
      # [skip ci] prevents this push from re-triggering the workflows.
      - name: Refresh committed evidence
        if: success()
        run: |
          git config user.name "ot-security-lab-ci"
          git config user.email "ci@ot-security-lab.invalid"
          rm -f detection/logs/alerts_archive.json
          git add -A detection/logs
          if git diff --cached --quiet; then
            echo "Evidence unchanged - nothing to commit."
          else
            git commit -m "chore(evidence): refresh compliance gate alert evidence [skip ci]"
            git push origin main
            echo "Evidence refreshed and pushed."
          fi

      # Debugging aid: publishes full diagnostics (boot log, container
      # states, gateway/webhook logs) to the ci-diagnostics branch so
      # failures can be inspected without read access to step logs.
      - name: Publish diagnostics (on failure)
        if: failure()
        run: |
          set +e
          {
            echo "## Compliance Gate Diagnostics - ${{ github.sha }}"
            echo "### boot.log"
            cat /tmp/boot.log 2>/dev/null
            echo "### docker ps -a"
            docker ps -a
            echo "### gateway logs"
            docker logs ot_gateway --tail 80
            echo "### gateway logs dir + rule outputs"
            docker exec ot_gateway sh -c "ls -la /detection/logs; for f in /detection/logs/*.out; do echo --- \$f; tail -30 \"\$f\"; done"
            echo "### gateway inspect state"
            docker inspect ot_gateway --format "{{json .State}}"
            echo "### attacker logs"
            docker logs ot_attacker --tail 40
            echo "### webhook logs"
            docker logs ot_webhook --tail 40
          } > ci-diagnostics.txt 2>&1
          cat ci-diagnostics.txt
          git config user.name "ot-security-lab-ci"
          git config user.email "ci@ot-security-lab.invalid"
          git switch -c ci-diagnostics
          cp /tmp/boot.log ci-boot.log 2>/dev/null
          git add ci-diagnostics.txt ci-boot.log 2>/dev/null
          git commit -m "compliance diagnostics ${{ github.sha }}" --allow-empty
          git push origin ci-diagnostics --force

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          cp -r detection/logs evidence/ci/
          docker exec ot_gateway sh -c "ls -la /detection/logs" > evidence/ci/gateway_ids.txt || true
          docker exec ot_gateway iptables -L -n > evidence/ci/firewall_rules.txt || true
          docker exec ot_gateway iptables -L -n -t nat > evidence/ci/firewall_nat.txt || true

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-evidence
          path: evidence/ci/
