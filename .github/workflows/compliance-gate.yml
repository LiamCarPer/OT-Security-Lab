name: Compliance Gate (Live Lab Validation)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  lab-validation:
    name: Boot Lab, Simulate Attacks, Assert Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot the OT lab
        working-directory: lab-environment
        run: |
          set +e
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee /tmp/boot.log
          code=${PIPESTATUS[0]}
          echo "BOOT_EXIT=$code" | tee -a /tmp/boot.log
          exit $code

      - name: Show firewall policy applied on gateway
        run: docker exec ot_gateway iptables -L -n | head -40

      - name: Run attack simulations and assert detection
        run: python3 governance/testing/run_security_tests.py --reset

      - name: Diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "## Compliance Gate Diagnostics - ${{ github.sha }}"
            echo "### boot.log"
            cat /tmp/boot.log 2>/dev/null
            echo "### docker ps -a"
            docker ps -a
            echo "### gateway logs"
            docker logs ot_gateway --tail 60
            echo "### gateway logs dir"
            docker exec ot_gateway sh -c "ls -la /detection/logs"
            echo "### gateway rule outputs"
            docker exec ot_gateway sh -c "for f in /detection/logs/*.out; do echo --- \$f; tail -30 \"\$f\"; done"
            echo "### webhook logs"
            docker logs ot_webhook --tail 60
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          echo "=== publishing paste ==="
          URL=$(curl -sS --max-time 30 --data-binary @/tmp/diag.txt https://paste.rs)
          echo "PASTE_URL=$URL"
          curl -sS --max-time 30 -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"compliance-diagnostics\",\"description\":\"Diagnostics: $URL\"}"

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          cp -r detection/logs evidence/ci/
          docker exec ot_gateway sh -c "ls -la /detection/logs" > evidence/ci/gateway_ids.txt || true
          docker exec ot_gateway iptables -L -n > evidence/ci/firewall_rules.txt || true
          docker exec ot_gateway iptables -L -n -t nat > evidence/ci/firewall_nat.txt || true

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: evidence/ci/
