version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Every Dockerfile in the lab (image base + pinned dependencies)
  - package-ecosystem: docker
    directory: /lab-environment/gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/attacker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/plc-bootstrap
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/hmi
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/scada
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/dnp3-outstation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # dnp3-python==0.3.0b2 publishes cp38/cp39/cp310 wheels only (no sdist), so
    # the base image cannot move past 3.10 until that binding ships a newer wheel.
    ignore:
      - dependency-name: python
        versions: [">=3.11"]

  - package-ecosystem: docker
    directory: /lab-environment/opcua-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/s7-plc
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/insider
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same dnp3-python==0.3.0b2 constraint as dnp3-outstation (no wheel >3.10).
    ignore:
      - dependency-name: python
        versions: [">=3.11"]

  - package-ecosystem: docker
    directory: /lab-environment/modbus-sim
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/historian-poller
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /lab-environment/route-sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /automation/playbooks
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
