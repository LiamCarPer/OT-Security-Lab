# source: rules/sigma/ot/ot_detection_service_down.yml
groups:
- name: ot_detection_service_down
  rules:
  - alert: Detection_Service_Stopped
    annotations:
      author: Liam Carvajal
      description: 'Detects a detection producer that has stopped running. In OT,
        a sensor that dies - from a crash or from an adversary stopping it - leaves
        the plant blind without any event on the wire. The gateway watchdog checks
        every producer process and raises this so the loss of visibility is itself
        detected (Inhibit Response Function).


        This is the counterpart to the "monitor the monitors" requirement: the
        absence of an expected heartbeat is the signal.

        '
      summary: Detection Service Stopped
    expr: sum(count_over_time({job=~".+"} | logfmt | alert_type=~`(?i)^DETECTION_SERVICE_DOWN$`
      [5m])) or vector(0) > 0
    labels:
      severity: critical
